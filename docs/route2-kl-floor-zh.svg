<svg xmlns="http://www.w3.org/2000/svg" width="780" height="446" viewBox="0 0 780 446" role="img" aria-label="端到端 KL 误差三层加法分解（FP16 vs BF16 部署）">
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  .card{fill:#ffffff;stroke:#c9d5d1;stroke-width:1}
  .mast{fill:#102f35}
  .mast-accent{fill:#8ad8ac}
  .mast-title{fill:#f0f9f4;font-size:15px;font-weight:700}
  .mast-sub{fill:#bfd1ce;font-size:10.8px}
  .fg{fill:#162b30}
  .mut{fill:#485f62}
  .ex-txt{fill:#c84b18}
  .grid{stroke:#e6eeea;stroke-width:1;stroke-dasharray:2,3}
  .axis{stroke:#9ab0ad;stroke-width:1}
  .b-bb{fill:#1d5b68}
  .b-lm{fill:#5aa79a}
  .b-ex{fill:#e06d33}
  .brk{fill:none;stroke:#ffffff;stroke-width:2.2}
  @media (prefers-color-scheme:dark){
    .card{fill:#0d1417;stroke:#24353b}
    .mast{fill:#0b2227}
    .fg{fill:#e6f1ee}
    .mut{fill:#8fa6aa}
    .ex-txt{fill:#f59454}
    .grid{stroke:#19272c}
    .axis{stroke:#395258}
    .b-bb{fill:#34889a}
    .b-lm{fill:#62b89e}
    .b-ex{fill:#f08448}
    .brk{stroke:#0d1417}
  }
</style>
<rect class="card" x="0.5" y="0.5" width="779" height="445" rx="8"/>
<path class="mast" d="M8,1 H772 Q779,1 779,8 V62 H1 V8 Q1,1 8,1 Z"/>
<rect class="mast-accent" x="1" y="62" width="778" height="3"/>
<text class="mast-title" x="22" y="29">端到端 KL 误差三层加法分解（FP16 vs BF16 部署）</text>
<text class="mast-sub" x="22" y="49">Llama-3.2-1B：FP16 组为全量 288k 真 FP64 参考；BF16 组约放大 ~64×（在误差范围内等于 (2³)²）；横跨两种格式均呈 ~35% 骨干 / ~65% lm_head 拆分</text>

<!-- Legend -->
<rect class="b-bb" x="22" y="79" width="14" height="10" rx="2"/>
<text class="fg" x="42" y="88" font-size="11">骨干离散舍入饱和地板 (~35%)</text>
<rect class="b-lm" x="280" y="79" width="14" height="10" rx="2"/>
<text class="fg" x="300" y="88" font-size="11">lm_head 末层输出量化地板 (~65%)</text>
<rect class="b-ex" x="546" y="79" width="14" height="10" rx="2"/>
<text class="fg" x="566" y="88" font-size="11">方法自身绝对超额 KL</text>

<!-- Panel titles -->
<text class="fg" x="236" y="122" font-size="11.5" font-weight="600" text-anchor="middle">FP16 骨干（288k 真 FP64，单位 10⁻⁶ KL）</text>
<text class="fg" x="614" y="122" font-size="11.5" font-weight="600" text-anchor="middle">BF16 骨干（FP32-RN，单位 10⁻⁴ KL，约 64× 尺度）</text>

