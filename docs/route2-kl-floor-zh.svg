<!-- Footnote -->
<text class="mut" x="22" y="410" font-size="10.2">注：右侧 BF16 坐标轴刻度（10⁻⁴）约为左侧 FP16（10⁻⁶）的 64 倍。不加刷新的 Pure F16 在 FP16 下高达 303×10⁻⁶（超出左轴 15×，截断标注），在 BF16 下达 12.6×10⁻⁴。</text>
<text class="mut mono" x="22" y="428" font-size="9.8">FP16: 4.59e-6 (35.0%) + 8.50e-6 (65.0%) = 13.09e-6  |  BF16: 2.86e-4 (34.6%) + 5.40e-4 (65.4%) = 8.26e-4  |  BF16/FP16 ratio: ~63.1x (both floors ~64x)</text>
