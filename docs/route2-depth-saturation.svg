<rect class="card" x="0.5" y="0.5" width="779" height="419" rx="8"/>
<path class="mast" d="M8,1 H772 Q779,1 779,8 V62 H1 V8 Q1,1 8,1 Z"/>
<rect class="mast-accent" x="1" y="62" width="778" height="3"/>
<text class="mast-title" x="22" y="29">Discrete Rounding Saturation vs. Depth · Hidden-State Flip Rate (vs. True FP64)</text>
<text class="mast-sub" x="22" y="49">Even IEEE FP32-RN (1.4e-7 single-GEMM error) converges by L5–L9 to the same ~85%–87% grid-saturation plateau as Pure B1</text>

<!-- Legend -->
<line class="ln-rn" x1="22" y1="84" x2="44" y2="84"/>
