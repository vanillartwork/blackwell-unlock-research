<script>
"use strict";
const gpuList = JSON.parse(document.getElementById("gpu-data").textContent);
const precisions = ["BF16", "FP16", "FP8", "TF32", "FP32"];
const fullFma = {FP32:128, TF32:256, FP16:512, BF16:512, FP8:1024};
// Single B200: HGX figures divided by eight GPUs and, for tensors, by two for sparsity.
const b200Dense = {FP32:75, TF32:1125, FP16:2250, BF16:2250, FP8:4500};
// Upstream estimates for the 6144-core DGX Spark. NVIDIA publishes an FP4 AI figure.
const sparkEstimate = {FP32:31.3, TF32:31.3, FP16:62.6, BF16:62.6, FP8:125.2};
const copy = {
 en:{
 title:"Blackwell throughput",intro:"Compare dense arithmetic peaks at reference boost clocks. Change the precision to see which paths leave half the modeled tensor throughput unused.",
 precision:"Precision",laptop:"Laptops",pro:"RTX PRO",systems:"B200 / Spark",log:"Log scale",factory:"Factory / reference peak",limit:"Hypothetical full-rate ceiling",software:"Route 2 · FP16 path reference (0.8×)",method:"How to read the model",refs:"Sources and specifications",measure:"GB205 benchmark and accuracy results",
 formula:"Dense TFLOP/s = SM count × FMA per SM per clock × 2 × boost (MHz) ÷ 1,000,000",
 models:"One fused multiply-add counts as two operations. FP32 uses CUDA cores. All tensor modes assume FP32 accumulation and exclude sparsity. The full-rate RTX profiles use 256 TF32, 512 FP16/BF16 or 1,024 FP8 FMA per SM per clock. The GeForce RTX 50-series and RTX 4090 factory model halves those rates. The extension asks what the same silicon could deliver at full rate. The Blackwell research has not demonstrated that change on RTX 50-series hardware.",
 anchor:"The GeForce RTX 4090 is the Ada comparison: its tensor rows show both the half-rate factory peak and the modeled full-rate ceiling. Its FP32 CUDA-core row is unchanged. RTX PRO uses a full-rate desktop profile. B200 uses published HGX dense peaks per GPU. GB10 uses upstream estimates derived from the FP4 specification. Neither system uses an assumed boost clock. The 5090 D row models SM throughput only; its separate product-level AI limits may lower sustained results.",
 route2:"The 0.8× line is a guide for the faster FP16 accumulation path, extrapolated from 0.80–0.83× in the GB205 benchmark. At K = 8192 the chunked operator reached 0.58× and 0.65× of the clock-normalized ceiling at chunk sizes 2048 and 4096, with lower error than full-length FP16. Other models and matrix shapes need their own measurements.",
 credit:"Specification data adapted from",factoryTo:"Factory / hypothetical ceiling",factoryOnly:"Factory peak",linear:"Linear axis from zero",logarithmic:"Log axis from 1 TFLOP/s",sorted:"models · sorted by ceiling",note:"Values are dense TFLOP/s. The second number is the total hypothetical peak. Desktop reference clocks and the top of each laptop’s published boost range are used. Board power and sustained clocks vary.",estimate:"estimate",published:"published",core:"CUDA cores",acc:"FP32 accumulation",chart:"Dense throughput",units:"TFLOP/s"
 },
 zh:{
 title:"Blackwell 算力对照",intro:"按参考 Boost 频率比较稠密运算峰值。切换精度，可以看到哪些路径在模型中只用了约一半的张量吞吐。",
 precision:"运算精度",laptop:"笔记本",pro:"专业卡",systems:"B200 / Spark",log:"对数刻度",factory:"出厂 / 对照峰值",limit:"理论满速上限",software:"路线 2 · FP16 路径参考（0.8×）",method:"如何读这张图",refs:"资料与规格来源",measure:"GB205 吞吐与误差实测",
 formula:"稠密 TFLOP/s = SM 数 × 每 SM 每时钟 FMA 数 × 2 × Boost 频率（MHz）÷ 1,000,000",
 models:"一次融合乘加计两次运算。FP32 使用 CUDA 核心，其余精度均指张量核、FP32 累加，不计稀疏加速。RTX 模型每 SM 每时钟的满速 FMA 数分别为 TF32 256、FP16/BF16 512、FP8 1024，消费级 RTX 50 系和 RTX 4090 的出厂估算取一半。延伸段表示同一芯片恢复满速时的假设上限。路线 1 尚未在 RTX 50 系上实现这一变化。",
 anchor:"作为 Ada 消费卡参照，RTX 4090 的张量路径同时显示半速出厂峰值和理论满速上限。FP32 CUDA 核心路径保持全速。RTX PRO 采用工作站满速模型。B200 按 NVIDIA 的 HGX 整机规格换算成单 GPU 稠密峰值；GB10 沿用上游从 FP4 规格折算的估计，两者均不虚设 Boost 频率。5090 D 仅按 SM 规格建模，其独立的产品级 AI 限制可能进一步降低实际吞吐。",
 route2:"0.8× 标线是较快 FP16 累加路径的参考值，依据 GB205 实测的 0.80–0.83× 推算。K = 8192 时，分块算子取 2048 和 4096 分别达到按时钟归一化满速的 0.58× 和 0.65×，误差均低于全程 FP16 累加。其他卡和矩阵形状需要单独测量。",
 credit:"规格数据改编自",factoryTo:"出厂峰值 / 假设满速上限",factoryOnly:"出厂峰值",linear:"线性轴，从零起",logarithmic:"对数轴，从 1 TFLOP/s 起",sorted:"款 · 按上限排序",note:"数值单位为稠密 TFLOP/s，第二个数是包含出厂段在内的总上限。桌面卡使用参考 Boost，笔记本使用官方 Boost 范围上端。实际频率受功耗配置与散热影响。",estimate:"估算",published:"官方规格换算",core:"CUDA 核心",acc:"FP32 累加",chart:"稠密吞吐对照",units:"TFLOP/s"
 }};
const byId = id => document.getElementById(id);
const initialLanguage = location.hash.slice(1);
let lang = ["zh","en"].includes(initialLanguage) ? initialLanguage : (navigator.language.startsWith("zh") ? "zh" : "en");
let precision = "BF16";
function peaks(card, mode) {
  if (card.category === "dc" || card.category === "soc") {
    const peak = (card.category === "dc" ? b200Dense : sparkEstimate)[mode];
    return {factory:peak, ceiling:peak};
  }
  const full = card.sm * fullFma[mode] * 2 * card.boostMHz / 1e6;
  const consumer = ["desktop","laptop","ada"].includes(card.category);
  const factory = consumer && mode !== "FP32" ? full / 2 : full;
  return {factory, ceiling:full};
}
function el(tag, cls, label) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (label !== undefined) node.textContent = label;
  return node;
}
function makeScale(max, log) {
  if (log) {
    const end = 10 ** Math.ceil(Math.log10(max));
    const ticks = [];
    for (let value = 1; value <= end; value *= 10) ticks.push(value);
    return {ticks, position:value => 100 * Math.log10(value) / Math.log10(end)};
  }
  const base = 10 ** Math.floor(Math.log10(max / 4));
  const step = [1, 2, 2.5, 5, 10].map(n => n * base).find(n => n >= max / 4);
  const end = Math.ceil(max / step) * step;
  return {ticks:Array.from({length: Math.round(end / step) + 1}, (_,i) => i * step), position:value => 100 * value / end};
}
function chartRow(item, scale, format, t) {
  const {card, factory, ceiling} = item;
  const row = el("div","chartrow");
  row.setAttribute("role","listitem");
  const info = el("div");
  const model = lang === "zh" ? card.model.replace(" Laptop"," 笔记本") : card.model;
  info.append(el("div","model",model));
  const clock = card.boostMHz ? card.boostMHz + " MHz" : (card.category === "dc" ? t.published : t.estimate);
  info.append(el("div","spec",card.die + " · " + card.sm + " SM · " + clock));
  const track = el("div","track");
  track.setAttribute("aria-hidden","true");
  const filled = el("span","stock");
  const split = scale.position(factory);
  filled.style.width = split + "%";
  track.append(filled);
  const numbers = el("div","numbers",format(factory));
  if (ceiling > factory) {
    const extension = el("span","extend");
    extension.style.left = split + "%";
    extension.style.width = (scale.position(ceiling) - split) + "%";
    track.append(extension);
    numbers.append(el("small","", " / "),el("b","",format(ceiling)));
    if (precision === "FP16" && card.category !== "ada") {
      const marker = el("span","marker");
      marker.style.left = scale.position(0.8 * ceiling) + "%";
      track.append(marker);
      row.title = t.software + " · " + format(0.8 * ceiling) + " TFLOP/s";
    }
  }
  row.setAttribute("aria-label",[model,t.factory,format(factory),...(ceiling>factory?[t.limit,format(ceiling)]:[]),row.title].filter(Boolean).join(" · "));
  row.append(info, track, numbers);
  return row;
}
function render() {
  const t = copy[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = t.title + " · blackwell-unlock-research";
  for (const node of document.querySelectorAll("[data-i]")) node.textContent = t[node.dataset.i];
  byId("language").textContent = lang === "zh" ? "English" : "中文";
  const local = location.protocol === "file:";
  byId("localReport").hidden = !local;
  if (local) byId("refs").href = lang === "zh" ? "references.cn.md" : "references.md";
  if (local) byId("measure").href = "../reports/gb205-2f18/README" + (lang === "zh" ? ".cn" : "") + ".md";
  byId("precision").setAttribute("aria-label",t.precision);
  for (const button of byId("precision").children) button.setAttribute("aria-pressed",String(button.textContent === precision));
  const visible = gpuList.filter(card => {
    if (card.category === "laptop") return byId("laptop").checked;
    if (card.category === "pro") return byId("pro").checked;
    if (["dc","soc"].includes(card.category)) return byId("systems").checked;
    return true;
  }).map(card => ({card,...peaks(card,precision)})).sort((a,b) => b.ceiling-a.ceiling || a.card.model.localeCompare(b.card.model));
  const log = byId("log").checked;
  const scale = makeScale(visible[0].ceiling,log);
  const number = new Intl.NumberFormat(lang,{minimumFractionDigits:1,maximumFractionDigits:1});
  const flagship = peaks(gpuList.find(card => card.model === "RTX 5090"),precision);
  const tensor = precision !== "FP32";
  byId("sampleTitle").textContent = "RTX 5090 · " + precision + " · " + (tensor?t.acc:t.core);
  byId("sample").replaceChildren(number.format(flagship.factory));
  if (tensor) byId("sample").append(el("span",""," → "),number.format(flagship.ceiling));
  byId("sampleNote").textContent = (tensor?t.factoryTo:t.factoryOnly) + " · TFLOP/s";
  byId("chartTitle").textContent = precision + " · " + t.chart;
  byId("count").textContent = visible.length + " " + t.sorted;
  byId("unit").textContent = t.units;
  byId("extraKey").style.display = tensor ? "" : "none";
  byId("markerKey").style.display = precision === "FP16" ? "" : "none";
  byId("ticks").replaceChildren(...scale.ticks.map(value => {
    const tick = el("span","",String(value));
    tick.style.left = scale.position(value) + "%";
    return tick;
  }));
  byId("rows").replaceChildren(...visible.map(item => chartRow(item,scale,number.format,t)));
  byId("fp16Note").hidden = precision !== "FP16";
  byId("fp16Note").textContent = lang === "zh"
    ? "标线是全程 FP16 累加的参考。GB205 分块算子实测为 0.58×（K 块 2048）或 0.65×（K 块 4096），分块越小，误差越低。"
    : "The marker represents full-length FP16 accumulation. The GB205 chunked operator measured 0.58× at chunk size 2048 and 0.65× at 4096, with lower error at 2048.";
  byId("chartNote").textContent = (log?t.logarithmic:t.linear) + " · " + t.note;
}
for (const mode of precisions) {
  const button = el("button","",mode);
  button.type = "button";
  button.onclick = () => { precision = mode; render(); };
  byId("precision").append(button);
}
for (const control of document.querySelectorAll("input")) control.onchange = render;
byId("language").onclick = () => { lang = lang === "en" ? "zh" : "en"; location.hash = lang; render(); };
window.addEventListener("hashchange", () => { if (["#zh","#en"].includes(location.hash)) { lang = location.hash.slice(1); render(); } });
render();
</script></body></html>
