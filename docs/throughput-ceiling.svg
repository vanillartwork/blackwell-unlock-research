<svg xmlns="http://www.w3.org/2000/svg" width="780" height="466" viewBox="0 0 780 466" role="img" aria-label="Blackwell dense tensor throughput ceiling (BF16 / FP16, FP32 accumulation)">
<defs>
  <pattern id="hatch-light" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="8" height="8" fill="#c4eed3"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#9bdab2" stroke-width="3"/>
  </pattern>
  <pattern id="hatch-dark" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
    <rect width="8" height="8" fill="#1d4b3c"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#2b6e56" stroke-width="3"/>
  </pattern>
</defs>
<style>
  text{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Consolas,monospace}
  .card{fill:#ffffff;stroke:#c9d5d1;stroke-width:1}
  .mast{fill:#102f35}
  .mast-accent{fill:#8ad8ac}
  .mast-title{fill:#f0f9f4;font-size:16px;font-weight:700}
  .mast-sub{fill:#bfd1ce;font-size:11.5px}
  .cta-bg{fill:#1b4950;stroke:#74918f;stroke-width:1}
  .cta-txt{fill:#b0ecc4;font-size:11.5px;font-weight:600}
  .fg{fill:#162b30}
  .mut{fill:#485f62}
  .row-line{stroke:#e2e9e5;stroke-width:1}
  .grid{stroke:#e6eeea;stroke-width:1;stroke-dasharray:2,3}
  .trk{fill:#f2f5f3}
  .bar-fac{fill:#183c43}
  .bar-ada{fill:#5a6f73}
  .bar-ext{fill:url(#hatch-light);stroke:#51916b;stroke-width:1;stroke-dasharray:3,2}
  @media (prefers-color-scheme:dark){
    .card{fill:#0d1417;stroke:#24353b}
    .mast{fill:#0b2227}
    .fg{fill:#e6f1ee}
    .mut{fill:#8fa6aa}
    .row-line{stroke:#1c2b30}
    .grid{stroke:#19272c}
    .trk{fill:#162226}
    .bar-fac{fill:#4899a6}
    .bar-ada{fill:#6c8287}
    .bar-ext{fill:url(#hatch-dark);stroke:#66c796}
  }
</style>
